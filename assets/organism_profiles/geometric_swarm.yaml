geometry:
  primitives: [nodes, points, filaments]
  dimensionality: 3d
  thickness: instanced
  smoothing: sharp

motion:
  flow: boids-hybrid
  inertia: 0.83
  turbulence: 0.31
  collective_motion: 0.92

field:
  field_type: boids-field
  dimensions: 3
  divergence: 0.20

render:
  trails: true
